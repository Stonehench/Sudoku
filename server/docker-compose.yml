name: sudoku-backend

services:
  api:
    build: 
      context: ..
      target: development
    volumes:
    - .:/app
    - ../solver:/solver
    - ../migration:/migration
    - cargo_target:/app/target
    command: cargo watch -x run
    environment:
      DATABASE_URL: mysql://root:supersecurepassword@db:3306/Scoreboard

    ports:
    - 0.0.0.0:8080:80

    depends_on:
    - db
  db:
    image: mariadb
    environment:
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: supersecurepassword
    ports:
    - '3306:3306'
    volumes:
    - db_data:/var/lib/mysql
    - ./init.sql:/docker-entrypoint-initdb.d/init.sql
  
volumes:
  cargo_target:
  db_data: